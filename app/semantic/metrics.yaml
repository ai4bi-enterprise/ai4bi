  domain: cashflow
  source: cashflow
  sql: SUM(CASE WHEN l.grp = 'CFO' THEN t.amount ELSE 0 END)
  joins: [line]
  format: money
  better: up
  synonyms: [dòng tiền kinh doanh, dòng tiền hoạt động, cfo, lưu chuyển tiền từ hoạt động kinh doanh, dòng tiền hđkd,
             dòng tiền từ hoạt động kinh doanh, dòng tiền hoạt động kinh doanh, dòng tiền từ hđkd]
cfi:
  label: Lưu chuyển tiền từ HĐ đầu tư
  domain: cashflow
  source: cashflow
  sql: SUM(CASE WHEN l.grp = 'CFI' THEN t.amount ELSE 0 END)
  joins: [line]
  format: money
  synonyms: [dòng tiền đầu tư, cfi, capex, dòng tiền từ hoạt động đầu tư, dòng tiền hoạt động đầu tư,
             lưu chuyển tiền từ hoạt động đầu tư]
cff:
  label: Lưu chuyển tiền từ HĐ tài chính
  domain: cashflow
  source: cashflow
  sql: SUM(CASE WHEN l.grp = 'CFF' THEN t.amount ELSE 0 END)
  joins: [line]
  format: money
  synonyms: [dòng tiền tài chính, cff, dòng tiền từ hoạt động tài chính, dòng tiền hoạt động tài chính,
             lưu chuyển tiền từ hoạt động tài chính]
net_cash_flow:
  label: Lưu chuyển tiền thuần trong kỳ
  domain: cashflow
  source: cashflow
  sql: SUM(t.amount)
  format: money
  better: up
  synonyms: [dòng tiền thuần, lưu chuyển tiền thuần, dòng tiền, cash flow, thay đổi tiền]
cf_amount:
  label: Giá trị
  domain: cashflow
  source: cashflow
  sql: SUM(t.amount)
  format: money
  internal: true
fcf:
  label: Dòng tiền tự do (FCF)
  domain: cashflow
  formula: cfo + cfi
  format: money
  better: up
  synonyms: [dòng tiền tự do, fcf, free cash flow]
cash_conversion:
  label: Tỷ lệ chuyển hoá LNST thành tiền
  domain: cashflow
  formula: cfo / npat
  format: pct
  better: up
  assess: {good: 0.9, warn: 0.7}
  synonyms: [chất lượng lợi nhuận, tỷ lệ chuyển hoá tiền, lợi nhuận ra tiền]

# ============================ TỒN KHO (bi_inventory, chụp cuối tháng)
inventory_value:
  label: Giá trị tồn kho
  domain: inventory
  source: inventory
  sql: SUM(t.value_end)
  format: money
  better: down
  synonyms: [tồn kho, giá trị tồn kho, hàng tồn, hàng tồn kho, inventory]
inventory_units:
  label: Số lượng tồn
  domain: inventory
  source: inventory
  sql: SUM(t.units_end)
  format: number
  synonyms: [số lượng tồn, tồn kho số lượng]
sku_count:
  label: Số mã hàng đang tồn
  domain: inventory
  source: inventory
  sql: COUNT(DISTINCT CASE WHEN t.units_end > 0 THEN t.product_code END)
  format: number
  synonyms: [số mã hàng, số sku]
sku_below_safety:
  label: Mã hàng dưới mức an toàn
  domain: inventory
  source: inventory
  sql: COUNT(DISTINCT CASE WHEN t.units_end < t.safety_stock THEN t.product_code END)
  format: number
  better: down
  synonyms: [dưới mức an toàn, thiếu hàng, sắp hết hàng, cần nhập thêm, tồn kho an toàn]
sku_below_reorder:
  label: Mã hàng cần đặt lại
  domain: inventory
  source: inventory
  sql: COUNT(DISTINCT CASE WHEN t.units_end <= t.reorder_point THEN t.product_code END)
  format: number
  better: down
  synonyms: [điểm đặt hàng, cần đặt hàng, reorder]
inventory_cover:
  label: Số ngày tồn kho (theo giá vốn bán)
  domain: inventory
  formula: inventory_value / sales_cogs * days
  format: days
  better: down
  assess: {good: 180, warn: 270}
  synonyms: [số ngày tồn kho, vòng quay tồn kho, tồn kho đủ bán bao lâu, ngày tồn kho]
