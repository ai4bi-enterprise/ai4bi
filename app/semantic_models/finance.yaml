# =============================================================================
# Gói ngữ nghĩa: TÀI CHÍNH & DÒNG TIỀN (Community – mẫu)
# Chỉ số dẫn xuất (formula) được tính SAU khi lấy chỉ số gốc, cùng hạt dữ liệu.
# =============================================================================
sources:
  expense:
    table: v_expense
    kind: period
    dimensions: {nam: nam, quy: quy, thang: thang, chi_nhanh: chi_nhanh, loai_chi_phi: loai_chi_phi}
  cash:
    table: v_cash
    kind: period
    dimensions: {nam: nam, quy: quy, thang: thang, chi_nhanh: chi_nhanh,
                 loai_khach_hang: loai_khach_hang, khach_hang: khach_hang}
  kpi:
    table: v_kpi
    kind: period
    dimensions: {nam: nam, quy: quy, chi_nhanh: chi_nhanh}

metrics:
  chi_phi_ban_hang:
    label: Chi phí bán hàng & quản lý
    source: expense
    sql: "SUM(so_tien)"
    format: money
    higher_is_better: false
    additive: true
    synonyms: ["chi phi ban hang", "chi phi van hanh", "chi phi", "opex"]
    related: [loi_nhuan_thuan, bien_loi_nhuan_thuan]
    actions:
      bad: "Rà soát khoản chi tăng mạnh ({worst}): đối chiếu với doanh thu tăng thêm và ngân sách đã duyệt."
      warn: "Đặt hạn mức chi theo tháng ({worst}) và theo dõi tỷ lệ chi phí trên doanh thu."
  thuc_thu:
    label: Dòng tiền thực thu
    source: cash
    sql: "SUM(so_tien_thu)"
    format: money
    additive: true
    description: "Tiền thực nhận từ khách hàng, ghi nhận theo ngày thanh toán."
    synonyms: ["dong tien thuc thu", "thuc thu", "tien thu ve", "thu tien", "dong tien", "tien mat thu"]
    related: [ty_le_thu_tien, no_qua_han_90, doanh_thu_thuan]
    actions:
      bad: "Lập kế hoạch thu hồi công nợ cho {worst}, ưu tiên các khoản quá hạn lớn; xem xét tạm ngừng giao hàng với khách nợ lâu."
      warn: "Theo dõi tiến độ thu tiền của {worst} hàng tuần."
  kpi_doanh_thu:
    label: KPI doanh thu
    source: kpi
    sql: "SUM(kpi)"
    format: money
    additive: true
    synonyms: ["kpi doanh thu", "chi tieu doanh thu", "ke hoach doanh thu", "kpi"]
    related: [ty_le_dat_kpi]
  loi_nhuan_thuan:
    label: Lợi nhuận thuần
    formula: "{loi_nhuan_gop} - {chi_phi_ban_hang}"
    format: money
    additive: true
    description: "Lợi nhuận gộp − Chi phí bán hàng & quản lý (mô hình đơn giản hóa cho dữ liệu mẫu)."
    synonyms: ["loi nhuan thuan", "loi nhuan rong", "lai rong", "loi nhuan", "net profit"]
    related: [bien_loi_nhuan_gop, chi_phi_ban_hang, doanh_thu_thuan]
    actions:
      bad: "Tách tác động lên lợi nhuận thuần {worst}: phần do biên lợi nhuận gộp giảm và phần do chi phí bán hàng tăng."
      warn: "Theo dõi lợi nhuận thuần {worst}; kiểm soát chi phí khuyến mại và vận chuyển."
  bien_loi_nhuan_thuan:
    label: Biên lợi nhuận thuần
    formula: "{loi_nhuan_thuan} / {doanh_thu_thuan}"
    format: pct
    assess: {good: 0.07, warn: 0.05}
    synonyms: ["bien loi nhuan thuan", "bien loi nhuan rong", "net margin"]
    related: [bien_loi_nhuan_gop, chi_phi_ban_hang]
    actions:
      bad: "Đặt mục tiêu biên lợi nhuận thuần tối thiểu cho {worst}; rà soát chi phí và chính sách chiết khấu."
      warn: "Theo dõi biên lợi nhuận thuần {worst}; tránh tăng trưởng doanh thu bằng mọi giá."
  ty_le_dat_kpi:
    label: Tỷ lệ đạt KPI
    formula: "{doanh_thu_thuan} / {kpi_doanh_thu}"
    format: pct
    assess: {good: 1.0, warn: 0.95}
    synonyms: ["ty le dat kpi", "dat kpi", "hoan thanh kpi", "% kpi", "% ke hoach"]
    related: [doanh_thu_thuan, bien_loi_nhuan_gop, thuc_thu]
    actions:
      bad: "Lập kế hoạch bù đắp phần thiếu hụt KPI cho {worst} trong kỳ còn lại."
      warn: "Tăng tần suất theo dõi tiến độ KPI của {worst} (hàng tuần)."
      good: "Xác nhận tăng trưởng vượt KPI của {best} đi kèm biên lợi nhuận và dòng tiền lành mạnh trước khi khen thưởng."
  ty_le_thu_tien:
    label: Tỷ lệ thu tiền / doanh thu
    formula: "{thuc_thu} / {doanh_thu_thuan}"
    format: pct
    assess: {good: 0.95, warn: 0.85}
    synonyms: ["ty le thu tien", "hieu suat thu tien", "cash conversion"]
    related: [no_qua_han_90, thuc_thu]
    actions:
      bad: "Siết điều kiện công nợ tại {worst}: kiểm soát hạn mức, ngừng giao hàng với khách quá hạn."
      warn: "Theo dõi tỷ lệ thu tiền của {worst} hàng tuần; nhắc nợ trước hạn."
