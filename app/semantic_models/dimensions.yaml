# =============================================================================
# AI4BI Semantic Layer – Chiều phân tích dùng chung (Community Edition)
# Mỗi chiều khai báo: nhãn hiển thị, từ đồng nghĩa để nhận diện câu hỏi,
# (tùy chọn) bí danh giá trị và hướng "đào sâu" (drill) dùng cho phần Gợi ý.
# Giá trị hợp lệ được nạp tự động từ database, nên Chatbot KHÔNG thể lọc theo
# một giá trị không tồn tại (chống "bịa").
# =============================================================================
dimensions:
  nam:
    label: Năm
    kind: time
    synonyms: ["theo nam", "tung nam", "hang nam"]
  quy:
    label: Quý
    kind: time
    synonyms: ["theo quy", "tung quy", "cac quy", "hang quy", "moi quy"]
  thang:
    label: Tháng
    kind: time
    synonyms: ["theo thang", "tung thang", "cac thang", "hang thang", "moi thang", "xu huong"]
  chi_nhanh:
    label: Chi nhánh
    values_sql: "SELECT TenCN FROM DanhMuc_ChiNhanh ORDER BY MaCN"
    synonyms: ["chi nhanh", "khu vuc", "vung mien", "mien nao", "vung"]
    drill: [nhom_hang, loai_khach_hang]
    value_aliases:
      "Miền Bắc": ["mien bac", "phia bac", "ha noi", "cn01"]
      "Miền Trung": ["mien trung", "da nang", "cn02"]
      "Miền Nam": ["mien nam", "phia nam", "sai gon", "tp hcm", "ho chi minh", "cn03"]
  nhom_hang:
    label: Nhóm hàng
    values_sql: "SELECT DISTINCT TenNhom FROM DanhMuc_SanPham ORDER BY TenNhom"
    synonyms: ["nhom hang", "nganh hang", "nhom san pham", "danh muc hang"]
    drill: [chi_nhanh, san_pham]
    value_aliases:
      "Nhóm A - Đồ uống": ["nhom a", "do uong", "nuoc giai khat"]
      "Nhóm B - Thực phẩm khô": ["nhom b", "thuc pham kho"]
      "Nhóm C - Hóa mỹ phẩm": ["nhom c", "hoa my pham"]
      "Nhóm D - Gia vị & Dầu ăn": ["nhom d", "gia vi", "dau an"]
  san_pham:
    label: Sản phẩm
    values_sql: "SELECT TenSP FROM DanhMuc_SanPham ORDER BY MaSP"
    synonyms: ["san pham", "mat hang", "sku"]
    drill: [chi_nhanh, loai_khach_hang]
  loai_khach_hang:
    label: Loại khách hàng
    values_sql: "SELECT DISTINCT LoaiKH FROM DanhMuc_KhachHang ORDER BY LoaiKH"
    synonyms: ["loai khach hang", "nhom khach hang", "phan khuc khach hang", "kenh ban hang", "kenh"]
    drill: [khach_hang, chi_nhanh]
    value_aliases:
      "Đại lý cấp 1": ["dai ly cap 1", "dai ly c1", "dl1", "npp"]
      "Đại lý cấp 2": ["dai ly cap 2", "dai ly c2", "dl2"]
      "Siêu thị (MT)": ["sieu thi", "kenh mt", "modern trade"]
      "Bán lẻ": ["ban le", "tap hoa", "kenh gt"]
    value_groups:
      "dai ly": ["Đại lý cấp 1", "Đại lý cấp 2"]
  khach_hang:
    label: Khách hàng
    values_sql: "SELECT TenKH FROM DanhMuc_KhachHang ORDER BY MaKH"
    synonyms: ["khach hang", "khach nao", "doi tac"]
    drill: [nhom_tuoi_no, nhom_hang]
  loai_chi_phi:
    label: Loại chi phí
    values_sql: "SELECT DISTINCT LoaiChiPhi FROM ChiPhi_BanHang ORDER BY LoaiChiPhi"
    synonyms: ["loai chi phi", "khoan muc chi phi", "co cau chi phi"]
    drill: [chi_nhanh]
  nhom_tuoi_no:
    label: Nhóm tuổi nợ
    ordered: true          # hiển thị theo thứ tự khai báo thay vì theo giá trị
    values: ["Trong hạn", "Quá hạn 1-30 ngày", "Quá hạn 31-90 ngày", "Quá hạn >90 ngày"]
    synonyms: ["tuoi no", "nhom tuoi no", "aging", "phan tich tuoi no"]
    drill: [khach_hang, chi_nhanh]
