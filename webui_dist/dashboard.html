<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI4BI · Revenue Dashboard</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/dashboard.css" />
</head>
<body>
  <header class="hbar">
    <div class="brand"><span class="logo">AI<b>4</b>BI</span><span class="sep"></span>
      <nav class="tabs">
        <a class="tab active" href="/">Revenue Dashboard</a>
        <a class="tab" href="/chat">Trợ lý AI</a>
      </nav>
    </div>
    <div class="hinfo" id="hinfo">
      <span id="hCompany">—</span>
      <span class="dot"></span><span>Dữ liệu đến <b id="hEnd">—</b></span>
      <span class="dot"></span><span>Tiến độ <b id="hTg">—</b></span>
      <span class="hbadge">Dữ liệu mẫu</span>
    </div>
  </header>

  <div class="cbar">
    <div class="seg" id="modeSeg">
      <button data-mode="mtd">MTD</button><button data-mode="qtd" class="on">QTD</button><button data-mode="ytd">YTD</button>
    </div>
    <label class="ctl">Năm <select id="selYear"></select></label>
    <label class="ctl">Tháng <select id="selMonth"></select></label>
    <div class="period" id="periodLbl">—</div>
    <div class="legend-inline">
      <span><i class="lg prior"></i>Kỳ trước</span><span><i class="lg actual"></i>Thực hiện</span><span><i class="lg kpi"></i>KPI</span>
    </div>
  </div>

  <main class="wrap" id="wrap">
    <section class="kpi-row" id="kpiRow"></section>

    <h2 class="sec-title">Theo chi nhánh <span class="sec-note" id="kpiNote"></span></h2>
    <section class="branch-row" id="branchRow"></section>

    <section class="grid2">
      <div class="panel-card" id="trendCard"></div>
      <div class="panel-card" id="groupCard"></div>
    </section>
    <section class="grid2">
      <div class="panel-card" id="topCust"></div>
      <div class="panel-card" id="topProd"></div>
    </section>
    <footer class="foot">AI4BI Community · Dữ liệu hư cấu phục vụ trình diễn · Số liệu tính qua cùng Semantic Layer với Trợ lý AI</footer>
  </main>

  <button class="fab" id="fab" aria-label="Mở trợ lý AI">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a2 2 0 0 1 2 2 2 2 0 0 1-1 1.73V7h4a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h4V5.73A2 2 0 0 1 10 4a2 2 0 0 1 2-2M9 11.5A1.5 1.5 0 1 0 9 14.5 1.5 1.5 0 0 0 9 11.5m6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M1 12h2v4H1zm20 0h2v4h-2z"/></svg>
    <span>Hỏi AI4BI</span>
  </button>

  <aside class="cpanel" id="cpanel" aria-hidden="true">
    <div class="cp-head">
      <div class="cp-title">Trợ lý AI4BI <small>Semantic Layer · không bịa số</small></div>
      <label class="cp-bod" title="Chế độ phân tích quản trị (BOD Deep-Dive)">
        <input type="checkbox" id="cpBod" /><span class="trk"><span class="thb"></span></span><span>BOD</span><span class="pro">PRO</span>
      </label>
      <a class="cp-btn" id="cpFull" href="/chat" title="Mở toàn màn hình">⤢</a>
      <button class="cp-btn" id="cpClose" aria-label="Đóng">×</button>
    </div>
    <iframe id="cpFrame" title="Trợ lý AI4BI" src="about:blank"></iframe>
  </aside>
  <div class="cp-backdrop" id="cpBackdrop"></div>

  <script src="/assets/dashboard.js"></script>
</body>
</html>
